# XcodeGen spec: `xcodegen generate` turns this into Onda.xcodeproj (done automatically in CI).
name: Onda
options:
  bundleIdPrefix: com.onda
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "9"

packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    from: "0.4.9"

targets:
  Onda:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Onda
    dependencies:
      - package: YouTubeKit
      # sherpa-onnx (ONNX Runtime inside) for the AI karaoke. Downloaded by CI, see build.yml.
      - framework: Frameworks/SherpaOnnxC.xcframework
        embed: true
    scheme: {}
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Onda
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Onda
        PRODUCT_BUNDLE_IDENTIFIER: com.onda.player
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
