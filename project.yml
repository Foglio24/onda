# XcodeGen spec: `xcodegen generate` turns this into Seaglass.xcodeproj (done automatically in CI).
name: Seaglass
options:
  bundleIdPrefix: com.onda
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # The code's text is Italian (it.lproj stays empty); English is in Seaglass/Resources/en.lproj.
  # English is the fallback for iPhones in any other language.
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.21.1"
    CURRENT_PROJECT_VERSION: "41"
    # Lists the localizable strings of each Swift file, for Tools/check_localization.py.
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    from: "0.4.9"

targets:
  Seaglass:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Seaglass
      # The karaoke's Core ML model (VocFT.mlmodelc), converted by CI: see build.yml.
      - path: Generated/Karaoke
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: YouTubeKit
    scheme: {}
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Seaglass
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - it
          - en
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        # Shows Documents in the Files app (Sul mio iPhone › Seaglass), where app updates are saved.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Seaglass
        # The identifier of when the app was called Onda: the same app, so updates keep its data.
        PRODUCT_BUNDLE_IDENTIFIER: com.onda.player
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
