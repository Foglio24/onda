# XcodeGen spec: `xcodegen generate` turns this into Seaglass.xcodeproj (done automatically in CI).
name: Seaglass
options:
  bundleIdPrefix: com.onda
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # The code's text is Italian (it.lproj stays empty); English is in Seaglass/Resources/en.lproj, and
  # French, Spanish, German, Portuguese, Chinese, Japanese, Russian, Turkish and Arabic beside it.
  # English is the fallback for iPhones in any other language.
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.28.1"
    CURRENT_PROJECT_VERSION: "55"
    # Lists the localizable strings of each Swift file, for Tools/check_localization.py.
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    from: "0.4.9"

targets:
  Seaglass:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Seaglass
      # The karaoke's Core ML model (VocFT.mlmodelc), converted by CI: see build.yml.
      - path: Generated/Karaoke
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: YouTubeKit
      # The Mac app's AppKit plug-in (menu bar icon, installing updates), in its PlugIns: Mac only.
      - target: SeaglassMac
        platformFilter: macOS
        embed: true
        codeSign: false
        copy:
          destination: plugins
    scheme: {}
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Seaglass
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - it
          - en
          - fr
          - es
          - de
          - pt
          - zh-Hans
          - ja
          - ru
          - tr
          - ar
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        # Shows Documents in the Files app (Sul mio iPhone › Seaglass), where app updates are saved.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # The Mac build sets it to true (build.yml), so the app outlives its closed window.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # On an iPad every orientation, so it also opens in resizable windows and Split View.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        # ProMotion on iPhone: the app's own animations (the player card, the panels) up to 120 Hz,
        # not only scrolling. An iPad uses it without asking.
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        # Where a Mac files it (Finder, Launchpad).
        LSApplicationCategoryType: public.app-category.music
    settings:
      base:
        PRODUCT_NAME: Seaglass
        # The identifier of when the app was called Onda: the same app, so updates keep its data.
        PRODUCT_BUNDLE_IDENTIFIER: com.onda.player
        # iPhone and iPad: one app (and one IPA) for both.
        TARGETED_DEVICE_FAMILY: "1,2"
        # And Macs with Apple silicon (Mac Catalyst): the iPad app, laid out as on an iPad, in a window.
        # CI builds it for arm64 and signs it ad hoc, without the sandbox (see build.yml and Storage).
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # The same identifier on a Mac, not "maccatalyst.com.onda.player".
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # What the Mac app needs from AppKit, which a Mac Catalyst app can't use itself: its icon in the
  # menu bar and installing an update over itself. Loaded by Seaglass/Services/MacBridge.swift.
  SeaglassMac:
    type: bundle
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Mac/Bridge
    settings:
      base:
        PRODUCT_NAME: SeaglassMac
        PRODUCT_BUNDLE_IDENTIFIER: com.onda.player.mac-bridge
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: SeaglassMacBridge
        SKIP_INSTALL: YES
