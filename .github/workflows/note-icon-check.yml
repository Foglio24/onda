name: Verify note icon
on:
  push:
    branches: [test/note-icon-check]
    paths: [.github/workflows/note-icon-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Verify asset catalog
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          xcrun actool Seaglass/Assets.xcassets --compile "$RUNNER_TEMP/assets" --platform iphoneos --minimum-deployment-target 26.0 --target-device iphone --app-icon AppIcon --output-partial-info-plist "$RUNNER_TEMP/icon-info.plist"
          test -f "$RUNNER_TEMP/assets/Assets.car"
