# One-off: deletes the iPhone/Mac releases before v1.30.0, whose apps unlock Seaglass Premium's
# features for free. Their tags stay (they hold only source code) and so do the Android releases.
# It prints the app downloads the deleted releases had, for Tools/count_downloads.py's total.
name: Delete old iOS releases

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE to delete every vX.Y.Z release before v1.30.0"
        required: true

permissions:
  contents: write

jobs:
  delete:
    if: ${{ inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete the releases before v1.30.0
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 - "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/old.txt" <<'EOF'
          import json, re, sys
          pages = json.load(open(sys.argv[1]))
          total = 0
          for release in (r for page in pages for r in page):
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", release["tag_name"])
              if not match or tuple(map(int, match.groups())) >= (1, 30, 0) or release["draft"]:
                  continue
              downloads = sum(a["download_count"] for a in release["assets"]
                              if a["name"].lower().endswith((".ipa", ".apk", "-mac.zip")))
              total += downloads
              print(release["id"], release["tag_name"], downloads)
          print(f"Archived app downloads: {total}", file=sys.stderr)
          EOF
          echo "### Releases to delete: $(wc -l < "$RUNNER_TEMP/old.txt")" >> "$GITHUB_STEP_SUMMARY"
          while read -r id tag downloads; do
            gh api -X DELETE "repos/$REPO/releases/$id"
            echo "Deleted $tag ($downloads app downloads)"
          done < "$RUNNER_TEMP/old.txt"
          awk '{ sum += $3 } END { print "Archived app downloads:", sum }' "$RUNNER_TEMP/old.txt" | tee -a "$GITHUB_STEP_SUMMARY"
