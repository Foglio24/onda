# Builds an unsigned Seaglass.ipa on a macOS runner, ready to be signed and installed
# with Sideloadly, AltStore or SideStore.
name: Build IPA

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
    # The Android app builds in its own workflow (android.yml).
    paths-ignore: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the release of the version in project.yml (vX.Y.Z), tagging this commit"
        type: boolean
        default: false
      recognition_probe:
        description: "Run only the song recognition checks and one live fingerprint lookup"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.recognition_probe }}
    # The iPhone and iPad app. macOS 26 is needed for Xcode 27 and its iOS 27 SDK (NowPlaying framework).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # A damaged image (1.21.1's and 1.22.1's app icons were) fails the build before anything else.
      - name: Check images
        run: python3 Tools/check_images.py

      - name: List installed Xcodes
        run: ls -d /Applications/Xcode* || true

      # "latest" includes release candidates: needed for the iOS 27 SDK until Xcode 27 is marked stable here.
      - name: Select the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Check app logic and energy budgets
        run: |
          bash Tools/PlaybackCheck/run.sh
          bash Tools/PlaybackVolumeCheck/run.sh
          bash Tools/LibraryCheck/run.sh
          bash Tools/AccountSyncCheck/run.sh
          bash Tools/LocalMusicCheck/run.sh
          bash Tools/LocalPlayableCheck/run.sh
          bash Tools/PlaylistImportCheck/run.sh
          bash Tools/ScrobbleCheck/run.sh
          bash Tools/UpdateCheck/run.sh
          bash Tools/RecognitionCheck/run.sh
          bash Tools/EqualizerCheck/run.sh
          bash Tools/SongDetailsCheck/run.sh
          bash Tools/EnergyCheck/run.sh
          bash Tools/AudioWorkCheck/run.sh
          bash Tools/StartupMetricsCheck/run.sh
          bash Tools/StreamCheck/run.sh
          bash Tools/RecommendationCheck/run.sh
          bash Tools/AutoMixCheck/run.sh
          bash Tools/AutoMixRenderCheck/run.sh
          bash Tools/SegueCheck/run.sh
          bash Tools/DeckCheck/run.sh
          bash Tools/AutoMixPlaybackProbe/run.sh
          bash Tools/OpusStreamCheck/run.sh
          bash Tools/AutoMixLevels/run.sh

      # Talks to the real YouTube Music: a failure means YouTube changed something (or is down),
      # so it is reported without blocking the build.
      - name: Check YouTube Music parsing (live)
        continue-on-error: true
        run: bash Tools/CatalogCheck/run.sh

      # From the tap to playing, on this machine's network: AAC, Opus progressive, Opus prepared and
      # the whole-file Opus of up to 1.15 (see Tools/OpusStartupProbe). Reported, never blocking.
      - name: Measure song startup (live)
        continue-on-error: true
        timeout-minutes: 5
        run: bash Tools/OpusStartupProbe/run.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      # The AI karaoke's vocal model, converted to Core ML (cached) and compiled.
      - name: Karaoke model
        uses: ./.github/actions/karaoke-model

      # Runs the app's own Swift separation code on macOS against onnxruntime's result.
      - name: Check the karaoke separation
        run: |
          swiftc -O Seaglass/Player/MDXSeparator.swift Tools/KaraokeCheck/main.swift -o build-karaoke-check
          ./build-karaoke-check Generated/Karaoke/VocFT.mlmodelc Generated/karaoke-fixture.bin
          rm build-karaoke-check

      - name: Beat model
        uses: ./.github/actions/beat-model

      # The app's own Beat This! front end and chunked Core ML inference against upstream's PyTorch.
      - name: Check the beat tracker
        run: bash Tools/BeatThisCheck/run.sh Generated/BeatThis/BeatThis.mlmodelc Generated/beat-fixture.bin

      # Where the account service is (server/account, deployed by account.yml), when it isn't
      # project.yml's: SEAGLASS_ACCOUNT_ORIGIN, or what Cloudflare says (a custom domain).
      - name: Find the account service
        id: account
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SEAGLASS_ACCOUNT_DOMAIN: ${{ vars.SEAGLASS_ACCOUNT_DOMAIN }}
          ORIGIN: ${{ vars.SEAGLASS_ACCOUNT_ORIGIN }}
        run: |
          if [ -n "$ORIGIN" ]; then
            echo "origin=$ORIGIN" >> "$GITHUB_OUTPUT"
          elif [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            node server/account/scripts/cloudflare.mjs origin
          else
            echo "::notice::The app keeps the account service's address in project.yml."
          fi

      - name: Generate Xcode project
        env:
          ACCOUNT_ORIGIN: ${{ steps.account.outputs.origin }}
        run: |
          mkdir -p Support
          xcodegen generate
          if [ -n "$ACCOUNT_ORIGIN" ]; then
            /usr/libexec/PlistBuddy -c "Set :SeaglassAccountOrigin $ACCOUNT_ORIGIN" Support/Info.plist
          fi

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Seaglass.xcodeproj \
            -scheme Seaglass \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # Every text the compiler finds in the code needs an English entry in en.lproj.
      - name: Check the English translation
        run: |
          plutil -lint Seaglass/Resources/*.lproj/Localizable.strings
          python3 Tools/check_localization.py build Seaglass/Resources/en.lproj/Localizable.strings \
            build/Build/Products/Release-iphoneos/Seaglass.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Seaglass.app Payload/
          zip -qry Seaglass.ipa Payload
          ls -lh Seaglass.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Seaglass-ipa
          path: Seaglass.ipa
          retention-days: 30

      # Debug symbols, to read the crash reports shared from Settings → Diagnostica.
      - name: Package debug symbols
        run: |
          cd build/Build/Products/Release-iphoneos
          if [ -d Seaglass.app.dSYM ]; then
            zip -qry "$GITHUB_WORKSPACE/Seaglass.app.dSYM.zip" Seaglass.app.dSYM
          else
            echo "::warning::No Seaglass.app.dSYM in the build products"
          fi

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: Seaglass-dSYM
          path: Seaglass.app.dSYM.zip
          if-no-files-found: ignore
          retention-days: 90

      # Screenshots of the main screens on an iPhone simulator, to check the UI without a device
      # (not when releasing: the release waits for this job).
      - name: Build for the simulator
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release }}
        continue-on-error: true
        run: |
          xcodebuild \
            -project Seaglass.xcodeproj \
            -scheme Seaglass \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Take screenshots
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release }}
        continue-on-error: true
        timeout-minutes: 20
        run: bash Tools/Screenshots/run.sh build-sim/Build/Products/Debug-iphonesimulator/Seaglass.app screenshots

      - name: Upload screenshots
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Seaglass-screenshots
          path: screenshots
          retention-days: 14

      # After the iPhone screenshots, on the simulator they booted (booting it took the whole time).
      - name: Take recognition screenshots
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release }}
        continue-on-error: true
        timeout-minutes: 8
        run: bash Tools/Screenshots/run.sh build-sim/Build/Products/Debug-iphonesimulator/Seaglass.app screenshots-recognition recognition

      - name: Upload recognition screenshots
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Seaglass-recognition-screenshots
          path: screenshots-recognition
          retention-days: 14

      # The same app on a 13-inch iPad Pro (its player also laid out as in landscape).
      - name: Take iPad screenshots
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release }}
        continue-on-error: true
        timeout-minutes: 15
        run: bash Tools/Screenshots/run.sh build-sim/Build/Products/Debug-iphonesimulator/Seaglass.app screenshots-ipad ipad

      - name: Upload iPad screenshots
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Seaglass-screenshots-ipad
          path: screenshots-ipad
          retention-days: 14

  mac:
    if: ${{ !inputs.recognition_probe }}
    # The same app for Macs with Apple silicon (Mac Catalyst), built beside the iPhone's.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Karaoke model
        uses: ./.github/actions/karaoke-model

      - name: Beat model
        uses: ./.github/actions/beat-model

      # On a Mac an app with one window quits when it's closed, and the music with it. With multiple
      # scenes it keeps playing, as Apple Music does, and the Dock icon opens the window again.
      # Only for the Mac: an iPad keeps a single window (SeaglassApp removes File › New Window).
      # Where the account service is (server/account, deployed by account.yml), when it isn't
      # project.yml's: SEAGLASS_ACCOUNT_ORIGIN, or what Cloudflare says (a custom domain).
      - name: Find the account service
        id: account
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SEAGLASS_ACCOUNT_DOMAIN: ${{ vars.SEAGLASS_ACCOUNT_DOMAIN }}
          ORIGIN: ${{ vars.SEAGLASS_ACCOUNT_ORIGIN }}
        run: |
          if [ -n "$ORIGIN" ]; then
            echo "origin=$ORIGIN" >> "$GITHUB_OUTPUT"
          elif [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            node server/account/scripts/cloudflare.mjs origin
          else
            echo "::notice::The app keeps the account service's address in project.yml."
          fi

      - name: Generate Xcode project
        env:
          ACCOUNT_ORIGIN: ${{ steps.account.outputs.origin }}
        run: |
          mkdir -p Support
          xcodegen generate
          /usr/libexec/PlistBuddy -c "Set :UIApplicationSceneManifest:UIApplicationSupportsMultipleScenes true" Support/Info.plist
          if [ -n "$ACCOUNT_ORIGIN" ]; then
            /usr/libexec/PlistBuddy -c "Set :SeaglassAccountOrigin $ACCOUNT_ORIGIN" Support/Info.plist
          fi

      - name: Build for Mac (unsigned)
        run: |
          xcodebuild \
            -project Seaglass.xcodeproj \
            -scheme Seaglass \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath build-mac \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # Signed ad hoc (there is no Developer ID): macOS asks once, in Privacy & Security, before
      # opening it. No sandbox: each version's ad hoc signature differs, and macOS would ask at every
      # update whether the new one may open the old one's container (see Seaglass/Models/Storage.swift).
      # Zipped with ditto to keep the signature.
      - name: Sign and package the Mac app
        run: |
          app=build-mac/Build/Products/Release-maccatalyst/Seaglass.app
          find "$app/Contents" -depth \( -name "*.framework" -o -name "*.dylib" -o -name "*.appex" -o -name "*.xpc" \) \
            -exec codesign --force --sign - --timestamp=none {} \;
          # The AppKit plug-in (menu bar, updates): there, and signed with the app.
          test -x "$app/Contents/PlugIns/SeaglassMac.bundle/Contents/MacOS/SeaglassMac"
          codesign --force --sign - --timestamp=none "$app/Contents/PlugIns/SeaglassMac.bundle"
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --entitlements - "$app"
          lipo -archs "$app/Contents/MacOS/Seaglass"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$app/Contents/Info.plist" || true
          test "$(/usr/libexec/PlistBuddy -c "Print :UIApplicationSceneManifest:UIApplicationSupportsMultipleScenes" "$app/Contents/Info.plist")" = true
          ls "$app/Contents/Resources" | grep -i -e karaoke -e VocFT -e icns || true
          # Keep the legacy ZIP for the updater test and existing installations.
          ditto -c -k --sequesterRsrc --keepParent "$app" Seaglass-mac.zip
          # The public Mac download is a read-only, compressed disk image.
          mkdir -p dmg-root
          ditto "$app" dmg-root/Seaglass.app
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Seaglass" -srcfolder dmg-root -format UDZO -imagekey zlib-level=9 -ov Seaglass-mac.dmg
          hdiutil verify Seaglass-mac.dmg
          ls -lh Seaglass-mac.dmg Seaglass-mac.zip

      # The Mac's updater, for real: the zip installed over a copy of the app, which opens again.
      - name: Check the Mac updater
        timeout-minutes: 5
        run: bash Tools/MacUpdateCheck/run.sh build-mac/Build/Products/Release-maccatalyst/Seaglass.app Seaglass-mac.zip

      - name: Check the Mac player close button
        timeout-minutes: 2
        run: bash Tools/MacPlayerCheck/run.sh build-mac/Build/Products/Release-maccatalyst/Seaglass.app

      # AutoMix's live transitions between three songs the app makes: planned beat-matched, each next
      # song started on a second player in step, mixed in and brought back to its own speed, two
      # mixes in a row; and the rendered mix with it turned off.
      - name: Check AutoMix's live mix on the Mac
        timeout-minutes: 15
        run: bash Tools/SegueScene/run.sh build-mac/Build/Products/Release-maccatalyst/Seaglass.app

      # Signed in to a throwaway account on the live account service, as the sign-in sheet leaves it:
      # the session stays in the Mac's keychain and Settings › Account shows the account. It talks
      # to the live service, so it doesn't block the build.
      - name: Check the account on the Mac (live)
        if: ${{ !inputs.release }}
        continue-on-error: true
        timeout-minutes: 3
        run: bash Tools/MacAccountCheck/run.sh build-mac/Build/Products/Release-maccatalyst/Seaglass.app screenshots-mac

      - name: Upload the Mac app
        uses: actions/upload-artifact@v4
        with:
          name: Seaglass-mac
          path: |
            Seaglass-mac.dmg
            Seaglass-mac.zip
          retention-days: 30

      # The Mac app's window at a few screens, as on the simulators.
      - name: Take Mac screenshots
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release }}
        continue-on-error: true
        timeout-minutes: 10
        run: bash Tools/Screenshots/mac.sh build-mac/Build/Products/Release-maccatalyst/Seaglass.app screenshots-mac

      - name: Upload Mac screenshots
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Seaglass-screenshots-mac
          path: screenshots-mac
          retention-days: 14

  recognition-probe:
    if: ${{ inputs.recognition_probe && !inputs.release }}
    runs-on: macos-26
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Check recognition parsing and native fingerprints
        run: bash Tools/RecognitionCheck/run.sh
      - name: Verify one native fingerprint against the community catalog
        run: bash Tools/RecognitionCheck/live.sh

  release:
    # Published once both apps are built: the IPA, its debug symbols and the Mac app.
    needs: [build, mac]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the IPA
        uses: actions/download-artifact@v4
        with:
          name: Seaglass-ipa

      - name: Download the debug symbols
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Seaglass-dSYM

      - name: Download the Mac app
        uses: actions/download-artifact@v4
        with:
          name: Seaglass-mac

      # The release's name and notes, which the app's update sheet shows: the version's section of
      # CHANGELOG.md, with those of any versions since the last release that were never released.
      # A version tag, or a run by hand with "release" (which tags this commit with the version in
      # project.yml).
      - name: Write the release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' project.yml)"
          fi
          previous=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)
          python3 Tools/release_notes.py CHANGELOG.md "${tag#v}" "${previous#v}" > release-notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=Seaglass ${tag#v}" >> "$GITHUB_OUTPUT"
          head -20 release-notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.notes.outputs.name }}
          body_path: release-notes.md
          files: |
            Seaglass.ipa
            Seaglass-mac.dmg
            Seaglass.app.dSYM.zip
