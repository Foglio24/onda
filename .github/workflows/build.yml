# Builds an unsigned Seaglass.ipa on a macOS runner, ready to be signed and installed
# with Sideloadly, AltStore or SideStore.
name: Build IPA

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the release of the version in project.yml (vX.Y.Z), tagging this commit"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    # macOS 26 is needed for Xcode 27 and its iOS 27 SDK (NowPlaying framework).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: List installed Xcodes
        run: ls -d /Applications/Xcode* || true

      # "latest" includes release candidates: needed for the iOS 27 SDK until Xcode 27 is marked stable here.
      - name: Select the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Check app logic and energy budgets
        run: |
          bash Tools/PlaybackCheck/run.sh
          bash Tools/LibraryCheck/run.sh
          bash Tools/ScrobbleCheck/run.sh
          bash Tools/UpdateCheck/run.sh
          bash Tools/EqualizerCheck/run.sh
          bash Tools/SongDetailsCheck/run.sh
          bash Tools/EnergyCheck/run.sh
          bash Tools/AudioWorkCheck/run.sh
          bash Tools/StartupMetricsCheck/run.sh
          bash Tools/StreamCheck/run.sh
          bash Tools/RecommendationCheck/run.sh
          bash Tools/AutoMixCheck/run.sh
          bash Tools/AutoMixRenderCheck/run.sh
          bash Tools/OpusStreamCheck/run.sh
          bash Tools/AutoMixLevels/run.sh

      # Talks to the real YouTube Music: a failure means YouTube changed something (or is down),
      # so it is reported without blocking the build.
      - name: Check YouTube Music parsing (live)
        continue-on-error: true
        run: bash Tools/CatalogCheck/run.sh

      # From the tap to playing, on this machine's network: AAC, Opus progressive, Opus prepared and
      # the whole-file Opus of up to 1.15 (see Tools/OpusStartupProbe). Reported, never blocking.
      - name: Measure song startup (live)
        continue-on-error: true
        timeout-minutes: 5
        run: bash Tools/OpusStartupProbe/run.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      # The AI karaoke's vocal model (UVR MDX-Net Voc_FT), converted from ONNX to Core ML.
      # Cached: it only changes with the conversion script.
      - name: Restore the karaoke model
        id: karaoke-model
        uses: actions/cache@v4
        with:
          path: |
            Generated/VocFT.mlpackage
            Generated/karaoke-fixture.bin
          key: karaoke-model-${{ hashFiles('Tools/convert_karaoke_model.py') }}

      - name: Set up Python
        if: steps.karaoke-model.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Convert the karaoke model to Core ML
        if: steps.karaoke-model.outputs.cache-hit != 'true'
        run: |
          python -m pip install --quiet "numpy==1.26.4" "torch==2.5.1" "coremltools==8.3.0" \
            "onnx==1.17.0" "onnx2torch==1.5.15" "onnxruntime==1.20.1"
          mkdir -p Generated
          curl -fsSL -o Generated/Voc_FT.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/source-separation-models/UVR-MDX-NET-Voc_FT.onnx
          python Tools/convert_karaoke_model.py Generated/Voc_FT.onnx Generated/VocFT.mlpackage \
            Generated/karaoke-fixture.bin
          rm Generated/Voc_FT.onnx

      - name: Compile the karaoke model
        run: |
          mkdir -p Generated/Karaoke
          xcrun coremlcompiler compile Generated/VocFT.mlpackage Generated/Karaoke
          du -sh Generated/Karaoke/VocFT.mlmodelc

      # Runs the app's own Swift separation code on macOS against onnxruntime's result.
      - name: Check the karaoke separation
        run: |
          swiftc -O Seaglass/Player/MDXSeparator.swift Tools/KaraokeCheck/main.swift -o build-karaoke-check
          ./build-karaoke-check Generated/Karaoke/VocFT.mlmodelc Generated/karaoke-fixture.bin
          rm build-karaoke-check

      - name: Generate Xcode project
        run: |
          mkdir -p Support
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Seaglass.xcodeproj \
            -scheme Seaglass \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # Every text the compiler finds in the code needs an English entry in en.lproj.
      - name: Check the English translation
        run: |
          plutil -lint Seaglass/Resources/*.lproj/Localizable.strings
          python3 Tools/check_localization.py build Seaglass/Resources/en.lproj/Localizable.strings \
            build/Build/Products/Release-iphoneos/Seaglass.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Seaglass.app Payload/
          zip -qry Seaglass.ipa Payload
          ls -lh Seaglass.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Seaglass-ipa
          path: Seaglass.ipa
          retention-days: 30

      # Debug symbols, to read the crash reports shared from Settings → Diagnostica.
      - name: Package debug symbols
        run: |
          cd build/Build/Products/Release-iphoneos
          if [ -d Seaglass.app.dSYM ]; then
            zip -qry "$GITHUB_WORKSPACE/Seaglass.app.dSYM.zip" Seaglass.app.dSYM
          else
            echo "::warning::No Seaglass.app.dSYM in the build products"
          fi

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: Seaglass-dSYM
          path: Seaglass.app.dSYM.zip
          if-no-files-found: ignore
          retention-days: 90

      # The release's name and notes, which the app's update sheet shows: the version's section of
      # CHANGELOG.md, with those of any versions since the last release that were never released.
      # A version tag, or a run by hand with "release" (which tags this commit with the version in
      # project.yml).
      - name: Write the release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' project.yml)"
          fi
          previous=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)
          python3 Tools/release_notes.py CHANGELOG.md "${tag#v}" "${previous#v}" > release-notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=Seaglass ${tag#v}" >> "$GITHUB_OUTPUT"
          head -20 release-notes.md

      - name: Attach IPA and debug symbols to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.notes.outputs.name }}
          body_path: release-notes.md
          files: |
            Seaglass.ipa
            Seaglass.app.dSYM.zip

      # Screenshots of the main screens on an iPhone simulator, to check the UI without a device.
      - name: Build for the simulator
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        run: |
          xcodebuild \
            -project Seaglass.xcodeproj \
            -scheme Seaglass \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Take screenshots
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        timeout-minutes: 20
        run: bash Tools/Screenshots/run.sh build-sim/Build/Products/Debug-iphonesimulator/Seaglass.app screenshots

      - name: Upload screenshots
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Seaglass-screenshots
          path: screenshots
          retention-days: 14
