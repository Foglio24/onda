# Builds an unsigned Onda.ipa on a macOS runner, ready to be signed and installed
# with Sideloadly, AltStore or SideStore.
name: Build IPA

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS 26 is needed for Xcode 27 and its iOS 27 SDK (NowPlaying framework).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: List installed Xcodes
        run: ls -d /Applications/Xcode* || true

      # "latest" includes release candidates: needed for the iOS 27 SDK until Xcode 27 is marked stable here.
      - name: Select the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Check app logic and energy budgets
        run: |
          bash Tools/PlaybackCheck/run.sh
          bash Tools/LibraryCheck/run.sh
          bash Tools/ScrobbleCheck/run.sh
          bash Tools/UpdateCheck/run.sh
          bash Tools/EqualizerCheck/run.sh
          bash Tools/SongDetailsCheck/run.sh
          bash Tools/EnergyCheck/run.sh
          bash Tools/AudioWorkCheck/run.sh
          bash Tools/StartupMetricsCheck/run.sh
          bash Tools/StreamCheck/run.sh
          bash Tools/RecommendationCheck/run.sh
          bash Tools/AutoMixCheck/run.sh
          bash Tools/AutoMixRenderCheck/run.sh

      # Talks to the real YouTube Music: a failure means YouTube changed something (or is down),
      # so it is reported without blocking the build.
      - name: Check YouTube Music parsing (live)
        continue-on-error: true
        run: bash Tools/CatalogCheck/run.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      # The AI karaoke's vocal model (UVR MDX-Net Voc_FT), converted from ONNX to Core ML.
      # Cached: it only changes with the conversion script.
      - name: Restore the karaoke model
        id: karaoke-model
        uses: actions/cache@v4
        with:
          path: |
            Generated/VocFT.mlpackage
            Generated/karaoke-fixture.bin
          key: karaoke-model-${{ hashFiles('Tools/convert_karaoke_model.py') }}

      - name: Set up Python
        if: steps.karaoke-model.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Convert the karaoke model to Core ML
        if: steps.karaoke-model.outputs.cache-hit != 'true'
        run: |
          python -m pip install --quiet "numpy==1.26.4" "torch==2.5.1" "coremltools==8.3.0" \
            "onnx==1.17.0" "onnx2torch==1.5.15" "onnxruntime==1.20.1"
          mkdir -p Generated
          curl -fsSL -o Generated/Voc_FT.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/source-separation-models/UVR-MDX-NET-Voc_FT.onnx
          python Tools/convert_karaoke_model.py Generated/Voc_FT.onnx Generated/VocFT.mlpackage \
            Generated/karaoke-fixture.bin
          rm Generated/Voc_FT.onnx

      - name: Compile the karaoke model
        run: |
          mkdir -p Generated/Karaoke
          xcrun coremlcompiler compile Generated/VocFT.mlpackage Generated/Karaoke
          du -sh Generated/Karaoke/VocFT.mlmodelc

      # Runs the app's own Swift separation code on macOS against onnxruntime's result.
      - name: Check the karaoke separation
        run: |
          swiftc -O Onda/Player/MDXSeparator.swift Tools/KaraokeCheck/main.swift -o build-karaoke-check
          ./build-karaoke-check Generated/Karaoke/VocFT.mlmodelc Generated/karaoke-fixture.bin
          rm build-karaoke-check

      - name: Generate Xcode project
        run: |
          mkdir -p Support
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Onda.xcodeproj \
            -scheme Onda \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # Every text the compiler finds in the code needs an English entry in en.lproj.
      - name: Check the English translation
        run: |
          plutil -lint Onda/Resources/*.lproj/Localizable.strings
          python3 Tools/check_localization.py build Onda/Resources/en.lproj/Localizable.strings \
            build/Build/Products/Release-iphoneos/Onda.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Onda.app Payload/
          zip -qry Onda.ipa Payload
          ls -lh Onda.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Onda-ipa
          path: Onda.ipa
          retention-days: 30

      # Debug symbols, to read the crash reports shared from Settings → Diagnostica.
      - name: Package debug symbols
        run: |
          cd build/Build/Products/Release-iphoneos
          if [ -d Onda.app.dSYM ]; then
            zip -qry "$GITHUB_WORKSPACE/Onda.app.dSYM.zip" Onda.app.dSYM
          else
            echo "::warning::No Onda.app.dSYM in the build products"
          fi

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: Onda-dSYM
          path: Onda.app.dSYM.zip
          if-no-files-found: ignore
          retention-days: 90

      - name: Attach IPA and debug symbols to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Onda.ipa
            Onda.app.dSYM.zip

      # Screenshots of the main screens on an iPhone simulator, to check the UI without a device.
      - name: Build for the simulator
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        run: |
          xcodebuild \
            -project Onda.xcodeproj \
            -scheme Onda \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Take screenshots
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        timeout-minutes: 10
        run: bash Tools/Screenshots/run.sh build-sim/Build/Products/Debug-iphonesimulator/Onda.app screenshots

      - name: Upload screenshots
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Onda-screenshots
          path: screenshots
          retention-days: 14
