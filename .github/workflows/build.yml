# Builds an unsigned Onda.ipa on a macOS runner, ready to be signed and installed
# with Sideloadly, AltStore or SideStore.
name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          mkdir -p Support
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Onda.xcodeproj \
            -scheme Onda \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Onda.app Payload/
          zip -qry Onda.ipa Payload
          ls -lh Onda.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Onda-ipa
          path: Onda.ipa
          retention-days: 30

      - name: Attach IPA to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Onda.ipa
