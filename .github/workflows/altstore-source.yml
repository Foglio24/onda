name: Refresh AltStore Classic source
on:
  workflow_dispatch:
  push:
    branches: [main, work/altstore-enhancements]
    paths: [.github/workflows/altstore-source.yml, Tools/update_altstore.py, altstore-source.json]
  schedule:
    - cron: "37 */6 * * *"
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: refresh-altstore-source
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || 'main' }}
      - name: Verify IPA and refresh listing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Tools/update_altstore.py
      - name: Validate source structure
        run: |
          python3 - <<'PY'
          import json
          s = json.load(open("altstore-source.json"))
          app = s["apps"][0]
          assert app["bundleIdentifier"] == "com.onda.player"
          assert len({v["version"] for v in app["versions"]}) == len(app["versions"])
          assert len({n["identifier"] for n in s["news"]}) == len(s["news"])
          assert all(v["downloadURL"].startswith("https://github.com/") and v["size"] > 0 for v in app["versions"])
          PY
      - name: Save validated source on main
        if: github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if git diff --quiet -- altstore-source.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore-source.json
          git commit -m "Update validated AltStore Classic source"
          git push origin HEAD:main
