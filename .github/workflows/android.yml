# Builds Seaglass for Android: checks the YouTube Music code against the real service, builds the
# signed APK, takes screenshots on an emulator, and publishes the APK as a GitHub pre-release
# (tag android-vX.Y.Z), which the app's "Cerca aggiornamenti" finds.
name: Android

on:
  push:
    branches: ["**"]
    paths: ["android/**", "Seaglass/Resources/*.lproj/**", ".github/workflows/android.yml"]
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the version in android/app/build.gradle.kts as a pre-release (android-vX.Y.Z)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the Android 17 SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      # The release key is the ANDROID_SIGNING_KEY secret (an EC private key in PEM); with the
      # public certificate in android/signing it becomes a keystore that exists only for this run.
      - name: Prepare the signing key
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          if [ -z "$ANDROID_SIGNING_KEY" ]; then
            echo "::warning::No ANDROID_SIGNING_KEY secret: this APK is signed with a temporary key and can't update an installed release."
            exit 0
          fi
          umask 077
          printf '%s\n' "$ANDROID_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          openssl pkcs12 -export -inkey "$RUNNER_TEMP/key.pem" -in signing/seaglass-cert.pem -name seaglass \
            -out "$RUNNER_TEMP/seaglass.p12" -passout "pass:$password"
          rm "$RUNNER_TEMP/key.pem"
          echo "SEAGLASS_KEYSTORE=$RUNNER_TEMP/seaglass.p12" >> "$GITHUB_ENV"
          echo "SEAGLASS_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - name: Check YouTube Music, audio links, lyrics and translations
        run: ./gradlew testDebugUnitTest --max-workers=2

      - name: Build the APK
        run: |
          ./gradlew assembleRelease --max-workers=2
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          # One APK per processor: arm64 for phones, 32-bit ARM for older ones, x86_64 for the emulator.
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "Seaglass-$version.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "Seaglass-$version-32bit.apk"
          cp app/build/outputs/apk/release/app-x86_64-release.apk "emulator.apk"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ls -la Seaglass-*.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "Seaglass-$version.apk" | grep -i "sha-256"
          if [ "${SIGNED:-}" = 1 ]; then
            expected=$(openssl x509 -in signing/seaglass-cert.pem -noout -fingerprint -sha256 | sed 's/.*=//; s/://g' | tr 'A-F' 'a-f')
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "Seaglass-$version.apk" | grep -q "SHA-256 digest: $expected"
            echo "Signed with the Seaglass release key ($expected)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Seaglass-android
          path: android/Seaglass-*.apk
          retention-days: 30

      - name: Enable KVM for the emulator
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take screenshots
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/Tools/screenshots.sh android/emulator.apk screenshots-android

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        with:
          name: Seaglass-android-screenshots
          path: screenshots-android
          retention-days: 14

      - name: Refuse to publish without the release key
        if: (startsWith(github.ref, 'refs/tags/android-v') || inputs.release) && env.SIGNED != '1'
        run: |
          echo "::error::Add the ANDROID_SIGNING_KEY secret before publishing: without it the APK could not update the installed app."
          exit 1

      - name: Write the release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/android-v') || inputs.release
        run: |
          tag="android-v$VERSION"
          python3 -I Tools/release_notes.py CHANGELOG.md "$VERSION" > release-notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          cat release-notes.md

      - name: Publish the pre-release
        if: startsWith(github.ref, 'refs/tags/android-v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Seaglass per Android ${{ env.VERSION }}
          body_path: android/release-notes.md
          prerelease: true
          make_latest: false
          files: |
            android/Seaglass-${{ env.VERSION }}.apk
            android/Seaglass-${{ env.VERSION }}-32bit.apk
