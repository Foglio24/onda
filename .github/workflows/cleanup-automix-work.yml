name: Clean up AutoMix work branches
on:
  push:
    branches: [release-trigger/v1.19.1]
    paths: [.github/workflows/cleanup-automix-work.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove only the unchanged work branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for spec in \
            'test/automix-beatmatch-fast:e77f5ce61ce055d4d547341f127e10130e1f0dc2' \
            'test/automix-real-benchmark:1e1655f97fcf29aa06ea5d817386805f5736af56' \
            'test/automix-render-baseline:eafeb61f1c8f7aee26127b3b91ab96427ac21788' \
            'test/automix-xcode27:7ace423fd514594bf94e146f1ddcf51a44246697' \
            'test/automix-tail-study:24055c76cd239355bdc8a42e303d64dbb1a928fe' \
            'test/automix-bias-study:445c73cb334ba6dd86355c47df1c40912c5b777d' \
            'feature/automix-prefer-beatmatching:69d8db8bf2fc9f48fd777946049b2b64c7a2c2c9' \
            'release-trigger/v1.20.0:580ba29e43b87129885496c471fdcbce6e305bc7'
          do
            branch="${spec%:*}"
            expected="${spec#*:}"
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha 2>/dev/null || true)
            if [ "$current" = "$expected" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
              echo "Removed $branch"
            else
              echo "Kept $branch because it changed or was already removed."
            fi
          done
