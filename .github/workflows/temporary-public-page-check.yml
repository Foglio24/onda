name: Check public project page
on:
  push:
    branches: [work/github-public-page]
    paths: [.github/workflows/temporary-public-page-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check latest IPA download responds
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --head --max-time 60 --output /dev/null --write-out 'Latest IPA HTTP %{http_code}\n' https://github.com/Foglio24/onda/releases/latest/download/Seaglass.ipa
      - name: Check the live download badge
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get --data-urlencode "url=https://raw.githubusercontent.com/Foglio24/onda/download-stats/download-count.json" "https://img.shields.io/endpoint" > "$RUNNER_TEMP/download-badge.svg"
          python3 - "$RUNNER_TEMP/download-badge.svg" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          text = " ".join(root.itertext()) + " " + " ".join(root.attrib.values())
          assert "download IPA totali" in text and any(c.isdigit() for c in text), text
          assert "invalid" not in text.lower() and "inaccessible" not in text.lower(), text
          print("Download badge returned a numeric count")
          PY
