# Seaglass's website (site/): tested on every change, and deployed to Cloudflare from main as a
# Worker that serves its files. The deploy finds the domain on the Cloudflare account
# (seaglass.<domain>, or SEAGLASS_SITE_DOMAIN), publishes the page and checks that it answers.
#
# Uses the same repository secret as the account service (CLOUDFLARE_API_TOKEN) and the same
# optional variables (CLOUDFLARE_ACCOUNT_ID, SEAGLASS_ACCOUNT_DOMAIN), plus SEAGLASS_SITE_DOMAIN
# (the host name of the page, e.g. www.example.com). Without the token nothing is deployed.
name: Website

on:
  push:
    branches: [main, "claude/**"]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Cloudflare (from main only)"
        type: boolean
        default: true

permissions:
  contents: read

# One deploy at a time.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Check the scripts
        run: |
          for file in scripts/*.mjs tests/*.mjs main.js boot.js; do node --check "$file"; done
      - run: npx playwright install --with-deps chromium
      - name: The page and its files, then the page in a browser (a computer, a phone, reduced motion, no JavaScript)
        env:
          SHOTS: ${{ runner.temp }}/site-shots
        run: npm test
      - name: The screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: ${{ runner.temp }}/site-shots
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: test
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SEAGLASS_SITE_DOMAIN: ${{ vars.SEAGLASS_SITE_DOMAIN }}
      SEAGLASS_ACCOUNT_DOMAIN: ${{ vars.SEAGLASS_ACCOUNT_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN isn't set: the website isn't deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        if: steps.token.outputs.ready == 'true'

      - name: Find the domain
        id: cloudflare
        if: steps.token.outputs.ready == 'true'
        run: node scripts/cloudflare.mjs

      - name: Build the files the Worker serves
        if: steps.token.outputs.ready == 'true'
        env:
          SITE_ORIGIN: ${{ steps.cloudflare.outputs.origin }}
          ACCOUNT_URL: ${{ steps.cloudflare.outputs.account_url }}
        run: node scripts/build.mjs

      - name: Deploy the Worker
        if: steps.token.outputs.ready == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: npx wrangler deploy -c wrangler.deploy.jsonc

      # A new custom domain gets its certificate within minutes: the first deploy may need them.
      - name: Check the page answers
        if: steps.token.outputs.ready == 'true'
        env:
          ORIGIN: ${{ steps.cloudflare.outputs.origin }}
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 10 "$ORIGIN/" | grep -q "Make every playlist"; then
              echo "$ORIGIN is up."
              curl -fsSI --max-time 10 "$ORIGIN/" | grep -i "content-security-policy" > /dev/null && echo "Security headers are on."
              echo "### Website: $ORIGIN" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 30
          done
          echo "::error::$ORIGIN didn't answer within 10 minutes (a new domain's certificate can take longer: run the workflow again)."
          exit 1
