name: AutoMix playback probe
on:
  push:
    branches: [test/automix-playback-probe]
    paths: [Tools/AutoMixPlaybackProbe/**, .github/workflows/automix-playback-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Verify rendered mixes and file validation
        run: bash Tools/AutoMixRenderCheck/run.sh
      - name: Exercise composition and player on macOS
        run: |
          swiftc -O -parse-as-library Seaglass/Player/AutoMixAnalysis.swift Seaglass/Player/AutoMixPlanner.swift Seaglass/Player/AutoMixFilters.swift Seaglass/Player/AutoMixSelection.swift Seaglass/Player/MixDesign.swift Seaglass/Player/AutoMixRenderer.swift Seaglass/Player/AutoMixPlayback.swift Seaglass/Player/AutoMix.swift Seaglass/Player/VocalDetector.swift Seaglass/Player/MDXSeparator.swift Seaglass/Player/HandoverFade.swift Tools/AutoMixPlaybackProbe/main.swift -o /tmp/automix-playback-probe
          /tmp/automix-playback-probe
      - name: Exercise the same path on an iPhone simulator
        timeout-minutes: 8
        run: |
          xcrun --sdk iphonesimulator swiftc -O -parse-as-library \
            -target arm64-apple-ios17.0-simulator -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            Seaglass/Player/AutoMixAnalysis.swift Seaglass/Player/AutoMixPlanner.swift Seaglass/Player/AutoMixFilters.swift Seaglass/Player/AutoMixSelection.swift Seaglass/Player/MixDesign.swift Seaglass/Player/AutoMixRenderer.swift Seaglass/Player/AutoMixPlayback.swift Seaglass/Player/AutoMix.swift Seaglass/Player/VocalDetector.swift Seaglass/Player/MDXSeparator.swift Seaglass/Player/HandoverFade.swift Tools/AutoMixPlaybackProbe/main.swift -o /tmp/automix-playback-probe-ios
          device="$(xcrun simctl list devices available --json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if "iPhone" in v["name"]))')"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl spawn "$device" /tmp/automix-playback-probe-ios
