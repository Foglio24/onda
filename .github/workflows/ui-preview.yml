# Screenshots of the interface on an iPhone simulator, on demand and on changes to the views, apart from
# build.yml so a change to how the app looks can be seen from a working branch in one go. The kind is
# Tools/Screenshots/run.sh's: "classic" (the classic interface style) by default.
name: Interface preview

on:
  push:
    branches: ["claude/**", "feature/**"]
    paths:
      - "Seaglass/Views/**"
      - "Seaglass/App/RootView.swift"
      - "Tools/Screenshots/**"
      - ".github/workflows/ui-preview.yml"
      - "Mac/**"
      - "project-uitests.yml"
  workflow_dispatch:
    inputs:
      kind:
        description: "Screenshots to take (iphone, ipad, classic)"
        default: classic
      mac:
        description: "Also the Mac's classic screenshots"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ui-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Karaoke model
        uses: ./.github/actions/karaoke-model
      - name: Beat model
        uses: ./.github/actions/beat-model
      - name: Generate Xcode project
        run: |
          mkdir -p Support
          xcodegen generate
      - name: Build for the simulator
        run: |
          xcodebuild \
            -project Seaglass.xcodeproj \
            -scheme Seaglass \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Take the screenshots
        run: bash Tools/Screenshots/run.sh build-sim/Build/Products/Debug-iphonesimulator/Seaglass.app preview "${{ inputs.kind || 'classic' }}"
      # The classic style's gestures with real touches (Tools/UITests): a song swiped both ways in
      # Cerca, the player dragged down, AutoMix switched in the queue. The log's "ui-check:" lines
      # say what happened; the screenshots of each step go with the others.
      - name: Interaction checks
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodegen generate --spec project-uitests.yml
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for r, l in sorted(devices.items()) if "iOS" in r for d in l if d["name"].startswith("iPhone")]
          pro = [d for d in phones if "Pro" in d["name"] and "Max" not in d["name"]]
          print((pro or phones)[-1]["udid"])')
          xcodebuild test \
            -project Seaglass.xcodeproj \
            -scheme SeaglassUITests \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build-sim \
            -resultBundlePath uitests.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee uitests.log | grep -E "ui-check:|Test Case .*(passed|failed)|error:|XCTAssert|\*\* TEST"
      - name: Interaction screenshots
        if: ${{ always() }}
        continue-on-error: true
        run: |
          mkdir -p preview/interactions
          xcrun xcresulttool export attachments --path uitests.xcresult --output-path preview/interactions || true
          cp uitests.log preview/interactions/ 2>/dev/null || true
          ls preview/interactions | head -40
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: interface-preview
          path: preview
          retention-days: 14
          if-no-files-found: ignore

  # The Mac app in the classic style, built and opened on the runner (see Tools/Screenshots/mac.sh).
  mac:
    if: ${{ github.event_name == 'push' || inputs.mac }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Karaoke model
        uses: ./.github/actions/karaoke-model
      - name: Beat model
        uses: ./.github/actions/beat-model
      - name: Generate Xcode project
        run: |
          mkdir -p Support
          xcodegen generate
          /usr/libexec/PlistBuddy -c "Set :UIApplicationSceneManifest:UIApplicationSupportsMultipleScenes true" Support/Info.plist
      - name: Build for Mac
        run: |
          xcodebuild \
            -project Seaglass.xcodeproj \
            -scheme Seaglass \
            -configuration Debug \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath build-mac \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      # Ad hoc, as build.yml signs it, so it opens on the runner.
      - name: Sign
        run: |
          app=build-mac/Build/Products/Debug-maccatalyst/Seaglass.app
          find "$app/Contents" -depth \( -name "*.framework" -o -name "*.dylib" -o -name "*.appex" -o -name "*.xpc" -o -name "*.bundle" \) \
            -exec codesign --force --sign - --timestamp=none {} \;
          codesign --force --sign - --timestamp=none "$app"
      - name: Take the screenshots
        run: bash Tools/Screenshots/mac.sh build-mac/Build/Products/Debug-maccatalyst/Seaglass.app preview-mac classic
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: interface-preview-mac
          path: preview-mac
          retention-days: 14
          if-no-files-found: ignore
