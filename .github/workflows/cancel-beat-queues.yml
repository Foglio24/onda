name: Cancel superseded beatmatching checks
on:
  push:
    branches: ['release-trigger/v1.19.1']
    paths: ['.github/workflows/cancel-beat-queues.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel two superseded queued runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for run in 40902413182 40902412860; do
            data="$(gh api "repos/${GH_REPO}/actions/runs/$run" --jq '[.head_branch, .head_sha, .status] | @tsv')"
            branch="$(printf '%s' "$data" | cut -f1)"
            sha="$(printf '%s' "$data" | cut -f2)"
            status="$(printf '%s' "$data" | cut -f3)"
            if [ "$branch" != 'test/automix-beatmatch-fast' ] || [ "$sha" != 'd385cafca577d7813eac5a366694604011a56916' ]; then
              echo '::error::unexpected run, refusing to cancel'
              exit 1
            fi
            if [ "$status" != 'completed' ]; then gh run cancel "$run" --repo "$GH_REPO"; fi
          done
