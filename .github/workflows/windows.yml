# Builds Seaglass for Windows 11 (Compose Desktop) and publishes a release tagged
# windows-vX.Y.Z. Never "Latest": that stays the iPhone/Mac release.
name: Windows

on:
  push:
    branches: ["**"]
    paths: ["windows/**", ".github/workflows/windows.yml"]
    tags: ["windows-v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the version in windows/CHANGELOG.md as windows-vX.Y.Z"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: windows
      - name: Unit tests
        working-directory: windows
        run: ./gradlew :app:test --no-daemon

  package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: windows
      - name: Read version
        id: ver
        shell: bash
        run: |
          version=$(sed -n 's/^## \([0-9][0-9.]*\).*/\1/p' windows/CHANGELOG.md | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Windows version $version"
      - name: Create distributable
        working-directory: windows
        shell: bash
        run: |
          ./gradlew :app:createReleaseDistributable \
            -Pseaglass.version=${{ steps.ver.outputs.version }} \
            --no-daemon
      - name: Zip for the auto-updater
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $appdir = Get-ChildItem -Path windows/app/build/compose/binaries -Recurse -Directory -Filter Seaglass |
            Where-Object { Test-Path (Join-Path $_.FullName 'Seaglass.exe') } |
            Select-Object -First 1
          if (-not $appdir) {
            Write-Error "No Seaglass app directory with Seaglass.exe under compose/binaries"
            Get-ChildItem -Path windows/app/build/compose -Recurse -Directory | Select-Object -First 80 FullName
            exit 1
          }
          $zip = Join-Path $PWD 'dist/Seaglass-windows.zip'
          if (Test-Path $zip) { Remove-Item $zip }
          # Contents at zip root so Seaglass.exe is found after extract (or in a Seaglass/ folder).
          Compress-Archive -Path (Join-Path $appdir.FullName '*') -DestinationPath $zip -CompressionLevel Optimal
          Get-ChildItem dist
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::OpenRead($zip).Entries | Select-Object -First 40 FullName
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Seaglass-windows
          path: dist/Seaglass-windows.zip

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/windows-v') || inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Seaglass-windows
      - name: Notes and tag
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/windows-v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(sed -n 's/^## \([0-9][0-9.]*\).*/\1/p' windows/CHANGELOG.md | head -1)
            tag="windows-v$version"
            if ! git rev-parse "$tag" >/dev/null 2>&1; then
              git tag "$tag"
              git push origin "$tag"
            fi
          fi
          version="${tag#windows-v}"
          python3 - <<PY
          from pathlib import Path
          text = Path("windows/CHANGELOG.md").read_text()
          lines = text.splitlines()
          out = []
          capture = False
          for line in lines:
              if line.startswith("## "):
                  if capture:
                      break
                  if line.startswith(f"## {version}"):
                      capture = True
                      continue
              elif capture:
                  out.append(line)
          Path("release-notes.md").write_text("\n".join(out).strip() + "\n")
          PY
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=Seaglass for Windows $version" >> "$GITHUB_OUTPUT"
          head -30 release-notes.md
      - name: Keep "Latest" on the iPhone app's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Softprops may leave make_latest alone; still never let a Windows tag become Latest.
          true
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.name }}
          body_path: release-notes.md
          files: Seaglass-windows.zip
          make_latest: false
      - name: Ensure Latest is still the iPhone release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          echo "Latest: $latest"
          case "$latest" in
            windows-v*|android-v*)
              ios=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq '[.[] | select((.tag_name | startswith("v")) and (.prerelease | not) and (.draft | not))][0].id')
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ios" -f make_latest=true > /dev/null
              echo "::warning::$latest had become Latest: the iPhone app's release is Latest again" ;;
          esac
